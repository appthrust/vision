name: Publish Vision

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write

# One writer owns the read/merge/PUT sequence across all Vision tags.
concurrency:
  group: vision-catalog-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'appthrust/vision'
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    # The model-bake RUN executes target-architecture code; never emulate it.
    runs-on: ${{ matrix.arch == 'arm64' && 'blacksmith-4vcpu-ubuntu-2404-arm' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select version
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          test "${#version}" -le 63
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and push the native architecture
        env:
          VERSION: ${{ steps.release.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker buildx build --platform "linux/$ARCH" --push \
            --tag "ghcr.io/appthrust/vision:$VERSION-$ARCH" \
            --label "org.opencontainers.image.source=https://github.com/appthrust/vision" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --metadata-file "$RUNNER_TEMP/vision-image.json" .
          digest="$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/vision-image.json")"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$digest" > "$RUNNER_TEMP/digests/$ARCH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vision-image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          if-no-files-found: error

  publish:
    if: github.repository == 'appthrust/vision'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: vision-image-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Select version
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          test "${#version}" -le 63
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create, resolve and sign the image index
        id: image
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          amd64="$(cat "$RUNNER_TEMP/digests/amd64")"
          arm64="$(cat "$RUNNER_TEMP/digests/arm64")"
          [[ "$amd64" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$arm64" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker buildx imagetools create --tag "ghcr.io/appthrust/vision:$VERSION" \
            "ghcr.io/appthrust/vision@$amd64" "ghcr.io/appthrust/vision@$arm64"
          digest="$(oras resolve "ghcr.io/appthrust/vision:$VERSION")"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          cosign sign --yes "ghcr.io/appthrust/vision@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Submit the catalog snapshot
        id: catalog
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
          CLOUD_API_URL: ${{ vars.CLOUD_API_URL || 'https://api.appthrust.com' }}
          CLOUD_CATALOG_ADMIN_TOKEN: ${{ secrets.CLOUD_CATALOG_ADMIN_TOKEN }}
        run: bun hack/publish-entry.ts submit --version "$VERSION" --digest "$DIGEST"
      - name: Mint the Cloud workflow dispatch token
        if: steps.catalog.outputs.state == 'snapshot'
        id: cloud-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.APPTHRUST_GITHUB_ACTIONS_APP_ID }}
          private-key: ${{ secrets.APPTHRUST_GITHUB_ACTIONS_APP_PRIVATE_KEY }}
          owner: appthrust
          repositories: cloud
      - name: Dispatch Cloud catalog publication
        if: steps.catalog.outputs.state == 'snapshot'
        env:
          GH_TOKEN: ${{ steps.cloud-token.outputs.token }}
          SNAPSHOT_ID: ${{ steps.catalog.outputs.snapshot_id }}
        run: gh api -X POST repos/appthrust/cloud/dispatches -f event_type=catalog-publish -f "client_payload[snapshot_id]=$SNAPSHOT_ID"
      - name: Observe the signed catalog
        timeout-minutes: 12
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: bun hack/publish-entry.ts await --version "$VERSION" --digest "$DIGEST"
